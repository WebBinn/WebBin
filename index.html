<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Joke Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --primary: #38bdf8;
      --primary-dark: #2563eb;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --button: #f59e0b;
      --button-dark: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: min(700px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 16px;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }

    .joke-box {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 24px;
      margin: 20px 0;
    }

    #jokeText {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      line-height: 1.7;
      color: var(--text);
      word-wrap: break-word;
    }

    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    button {
      background: linear-gradient(135deg, var(--button), var(--button-dark));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(245, 158, 11, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .loading {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😂 Random Joke Generator</h1>
    <div class="meta">One click, one laugh.</div>

    <div class="joke-box">
      <p id="jokeText" class="loading">Loading a joke...</p>
    </div>

    <button id="generateBtn">Generate Joke</button>
  </div>

  <script>
    const jokeText = document.getElementById('jokeText');
    const generateBtn = document.getElementById('generateBtn');

    async function getJoke() {
      jokeText.textContent = 'Loading a joke...';
      jokeText.classList.add('loading');

      try {
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');

        if (!response.ok) {
          throw new Error('Failed to fetch joke');
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.message || 'Joke API error');
        }

        jokeText.textContent = data.joke || `${data.setup} ${data.delivery}`;
        jokeText.classList.remove('loading');
      } catch (error) {
        jokeText.textContent = 'Oops! The joke API is not available right now. Please try again.';
        jokeText.classList.remove('loading');
        console.error(error);
      }
    }

    generateBtn.addEventListener('click', getJoke);

    getJoke();
  </script>
</body>
</html>
